<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MarketFlow - portfolio tracking and investment analytics"
    />
    <title>MarketFlow</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('marketflow.theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', resolved === 'dark')
          document.documentElement.style.colorScheme = resolved
        } catch (_error) {
          /* no-op: theme detection is best-effort */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
